<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamRank Argentina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; font-family: system-ui, sans-serif; }
    .pulse { animation: p 2s infinite; }
    @keyframes p { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col antialiased">
  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-3.5 h-3.5 rounded-full bg-emerald-500 pulse"></div>
        <span class="text-xl font-bold text-white">StreamRank <span class="text-xs bg-indigo-900 text-indigo-300 px-2 py-0.5 rounded border border-indigo-700/50">ARG</span></span>
      </div>
      <div class="flex items-center gap-4 text-xs font-medium text-slate-400">
        <span id="cnt" class="bg-slate-800 px-3 py-1 rounded-full border border-slate-700">0 en vivo</span>
      </div>
    </div>
  </header>

  <div class="bg-slate-900/40 border-b border-slate-800/50 py-2.5">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-1 text-xs text-slate-400">
      <div>Ranking en vivo de Twitch, Kick y YouTube</div>
      <div id="fullDate" class="text-indigo-300 font-medium">Sincronizando reloj...</div>
    </div>
  </div>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="mb-6 w-full h-20 rounded-xl border border-dashed border-slate-800 bg-slate-900/20 flex flex-col items-center justify-center text-slate-500 text-xs">
      <span class="font-bold tracking-wider uppercase">Espacio Publicitario</span>
    </div>

    <div id="grid" class="flex flex-col gap-3">
      <div class="p-6 text-center text-slate-500">Cargando canales...</div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    StreamRank Argentina &bull; Métricas en Tiempo Real
  </footer>

  <script>
    const grd = document.getElementById('grid');
    const cnt = document.getElementById('cnt');
    const fullDate = document.getElementById('fullDate');
    const fmt = n => new Intl.NumberFormat('es-AR').format(n);

    function updateClock() {
      const now = new Date();
      const d = now.toLocaleDateString('es-AR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      fullDate.textContent = d.charAt(0).toUpperCase() + d.slice(1) + ' · ' + now.toLocaleTimeString('es-AR');
    }
    updateClock();
    setInterval(updateClock, 1000);

    async function load() {
      try {
        const res = await fetch('/api/ranks');
        const json = await res.json();
        const list = json.data || [];
        cnt.textContent = list.filter(x => x.isLive).length + ' en vivo';

        if (!list.length) return;

        grd.innerHTML = list.map((s, idx) => {
          let b = '';
          if (s.platforms.twitch.active) b += '<span class="px-2 py-0.5 rounded text-xs bg-purple-950 text-purple-300 border border-purple-800">Twitch: ' + fmt(s.platforms.twitch.viewers) + '</span> ';
          if (s.platforms.kick.active) b += '<span class="px-2 py-0.5 rounded text-xs bg-emerald-950 text-emerald-300 border border-emerald-800">Kick: ' + fmt(s.platforms.kick.viewers) + '</span> ';
          if (s.platforms.youtube.active) b += '<span class="px-2 py-0.5 rounded text-xs bg-red-950 text-red-300 border border-red-800">YouTube: ' + fmt(s.platforms.youtube.viewers) + '</span> ';

          return '<div class="flex items-center justify-between p-4 rounded-xl border ' + (s.isLive ? 'border-slate-800 bg-slate-900/70' : 'border-slate-900 bg-slate-950/40 opacity-40') + '">' +
            '<div class="flex items-center gap-3">' +
              '<span class="w-6 font-bold text-sm ' + (idx < 3 && s.isLive ? 'text-amber-400' : 'text-slate-500') + '">#' + (idx + 1) + '</span>' +
              '<img src="' + s.avatar + '" class="w-11 h-11 rounded-full object-cover border border-slate-700 bg-slate-800" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(s.name) + '\'">' +
              '<div>' +
                '<h3 class="font-bold text-white text-sm">' + s.name + '</h3>' +
                '<div class="flex gap-1.5 mt-1">' + (s.isLive ? b : '<span class="text-xs text-slate-500">Offline</span>') + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="text-right">' +
              '<div class="text-xl font-extrabold ' + (s.isLive ? 'text-white' : 'text-slate-600') + '">' + (s.isLive ? fmt(s.totalViewers) : '0') + '</div>' +
              '<div class="text-[10px] uppercase font-bold text-slate-500">' + (s.isLive ? 'Viewers' : 'Offline') + '</div>' +
            '</div>' +
          '</div>';
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
