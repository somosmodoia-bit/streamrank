<header class="border-b border-slate-800/80 bg-[#050811]/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 sm:py-0 sm:h-16 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 sm:gap-0">
      
      <!-- Fila 1 en Mobile / Lado Izquierdo en Desktop -->
      <div class="flex items-center justify-between w-full sm:w-auto">
        <!-- Marca (Sin truncar) -->
        <div class="flex items-center space-x-2 sm:space-x-3 flex-shrink-0">
          <div class="w-6 h-6 sm:w-8 sm:h-8 flex-shrink-0 bg-black border border-[#00ff88] rounded-lg flex items-center justify-center relative">
            <span class="absolute inline-flex h-2.5 w-2.5 sm:h-3 sm:w-3 rounded-full bg-[#00ff88] opacity-75 animate-ping"></span>
            <span class="relative inline-flex rounded-full h-1.5 w-1.5 sm:h-2 sm:w-2 bg-[#00ff88]"></span>
          </div>
          <div class="flex items-baseline">
            <span class="text-[13px] sm:text-base font-extrabold tracking-wider text-white" style="font-family: 'Outfit', sans-serif;">STREAMRANK</span>
            <span class="text-[9px] sm:text-[10px] text-[#00ff88] font-mono font-bold ml-1">ARG</span>
            <span class="font-mono text-[10px] sm:text-sm font-semibold tracking-wider text-[#00ff88] ml-1.5 sm:ml-2">BETA</span>
          </div>
        </div>
        
        <!-- Botón Analytics (Solo visible en Mobile) -->
        <button onclick="abrirModalIA()" class="sm:hidden whitespace-nowrap bg-[#00ff88]/10 hover:bg-[#00ff88]/20 text-[#00ff88] text-[9px] font-semibold px-2.5 py-1.5 rounded border border-[#00ff88]/30 font-mono transition cursor-pointer ml-2">
          Descargar Analytics
        </button>
      </div>

      <!-- Fila 2 en Mobile / Lado Derecho en Desktop -->
      <div class="flex items-center sm:justify-end w-full sm:w-auto sm:space-x-3 pl-8 sm:pl-0 mt-0.5 sm:mt-0">
        <!-- Reloj / Fecha en una sola línea -->
        <span id="relojHeader" class="text-[11px] font-mono text-slate-400 whitespace-nowrap text-left sm:text-right w-full sm:w-auto">Sincronizando...</span>
        
        <!-- Botón Analytics (Solo visible en Desktop) -->
        <button onclick="abrirModalIA()" class="hidden sm:block whitespace-nowrap bg-[#00ff88]/10 hover:bg-[#00ff88]/20 text-[#00ff88] text-xs px-3 py-1.5 rounded-lg border border-[#00ff88]/30 font-mono transition cursor-pointer">
          Descargar Analytics
        </button>
      </div>

    </div>
  </header>
